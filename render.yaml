services:
  - type: web
    name: stock-tracker
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: stock-tracker-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: stock-tracker-db
    plan: free
